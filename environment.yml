name: open-model-tutorial

channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - pip
  - transformers>=4.50
  - accelerate
  - huggingface_hub
  - safetensors
  - sentencepiece
  - protobuf
  - tokenizers
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
